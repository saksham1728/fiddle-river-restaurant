<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('fiddle-river-theme')
          || 'dark';
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.classList.add(theme);
        if (theme === 'dark') {
          root.style.backgroundColor = '#080808';
        } else {
          root.style.backgroundColor = '#F5F0E8';
        }
      } catch (e) { }
    })();
  </script>
  <meta name="theme-color" content="#080808">
  <link rel="icon" type="image/webp" href="/logo.webp" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display:ital@0;1&family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <title>Fiddle River Restaurant - Jasper's Premier Seafood Restaurant</title>
  <meta name="description" content="Experience fresh seafood, wild game, and Canadian flavours in the heart of Jasper National Park. Taste Jasper, from River to Rockies." />
  <meta name="google-site-verification" content="Qw_BZWYX8DC0InrpTHqD_VPpAz1KU03w4boimo4hIoc" />
  
  <!-- Vanta.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanta/0.5.24/vanta.topology.min.js"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
